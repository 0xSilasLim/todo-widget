[package]
name = "todo-widget"
version = "0.6.0"
description = "A local Windows 11 floating todo widget"
authors = ["Todo Widget"]
edition = "2021"

[lib]
name = "todo_widget_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-version = "0.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
