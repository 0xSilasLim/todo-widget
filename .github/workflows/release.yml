name: Windows Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component clippy
      - name: Install frontend dependencies
        run: npm ci
      - name: Frontend tests
        run: npm test
      - name: Rust tests
        run: npm run test:rust -- --locked
      - name: Rust lint
        run: npm run check:rust
      - name: Build Windows x64 app and installer
        run: npm run desktop:build -- --ci -- --locked
      - name: Prepare release files and verify version
        run: npm run release:prepare
      - name: Save release build artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: todo-widget-windows-x64
          path: release/*
          if-no-files-found: error
          retention-days: 14
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $assets = @(Get-ChildItem -LiteralPath release -File | ForEach-Object FullName)
          gh release create "$env:GITHUB_REF_NAME" @assets --verify-tag --latest --title "Todo Widget $env:GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
